<title>HSK 1–5 Flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans:wght@500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. Level chips and options on top, a 田字格 practice card in the middle,
   Again / Got it under the card, tone-colour key at the foot. */
:root {
  --bg: #ECF0ED;
  --surface: #FAFCFA;
  --ink: #15201C;
  --ink-2: #53625D;
  --line: #C7D1CC;
  --accent: #1B6A5E;
  --accent-ink: #FFFFFF;
  --bad: #B03A2A;
  --grid: #D4695A;
  --grid-soft: #E3A79E;
  --t1: #C0392B;
  --t2: #B26A0A;
  --t3: #1E7B4B;
  --t4: #2A5DB5;
  --t5: #6B7873;
  --font-ui: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-py: 'Noto Sans', 'Hanken Grotesk', system-ui, sans-serif;
  --font-zh: 'Noto Serif SC', 'Songti SC', 'STSong', 'Source Han Serif SC', 'SimSun', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #18221E; --ink: #E7EFEB; --ink-2: #9CAAA4; --line: #2B3934;
    --accent: #52BBA8; --accent-ink: #08120F; --bad: #FF8E7C; --grid: #B25A4E; --grid-soft: #5E3B36;
    --t1: #FF7F70; --t2: #F2AB4A; --t3: #55CF90; --t4: #78A8FF; --t5: #9AA7A2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #18221E; --ink: #E7EFEB; --ink-2: #9CAAA4; --line: #2B3934;
  --accent: #52BBA8; --accent-ink: #08120F; --bad: #FF8E7C; --grid: #B25A4E; --grid-soft: #5E3B36;
  --t1: #FF7F70; --t2: #F2AB4A; --t3: #55CF90; --t4: #78A8FF; --t5: #9AA7A2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Elements with the hidden attribute must stay hidden even when a class sets display. */
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }

/* level chips */
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.chip {
  display: flex; flex-direction: column; gap: 3px; text-align: left;
  padding: 10px 12px 11px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink-2);
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); color: var(--ink); }
.chip b { font-size: 15px; font-weight: 700; }
.chip small { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

/* options */
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px;
  padding: 8px 12px; min-height: 40px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sw { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; min-height: 40px; }
.sw input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

/* stats */
.stats { display: flex; flex-direction: column; gap: 6px; }
.nums { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nums b { color: var(--ink); font-weight: 700; }
.stats .bar { margin: 0; height: 6px; border-radius: 3px; }

/* card */
.stage { position: relative; }
.speak {
  position: absolute; top: 8px; right: 8px; z-index: 2; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; border: 0; background: transparent; color: var(--ink-2);
}
.speak:hover { color: var(--accent); }
.speak svg { width: 22px; height: 22px; }
.card { perspective: 1200px; cursor: pointer; border-radius: 18px; -webkit-tap-highlight-color: transparent; }
.card-inner { display: grid; min-height: 350px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.2,1); }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card.snap .card-inner { transition: none; }
.face {
  grid-area: 1 / 1; position: relative; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 48px 20px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; text-align: center; min-width: 0;
}
.back { transform: rotateY(180deg); }
/* Some browsers ignore backface-visibility on text, so the hidden side showed through mirrored.
   Also hide each face with visibility, switching at the midpoint of the flip. */
.front, .back { transition: visibility 0s linear .22s; }
.back { visibility: hidden; }
.card.flipped .front { visibility: hidden; }
.card.flipped .back { visibility: visible; }
.card.snap .front, .card.snap .back { transition: none; }
.cell, .cell .g, .face * { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.tag { position: absolute; top: 16px; left: 18px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.hint { position: absolute; bottom: 14px; left: 0; right: 0; font-size: 12px; color: var(--ink-2); }

/* 田字格 cells */
.cells { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
.cell {
  position: relative; width: var(--cell, 112px); aspect-ratio: 1; display: grid; place-items: center;
  border: 1.5px solid var(--grid); background: var(--surface);
  font-family: var(--font-zh); font-weight: 500; font-size: calc(var(--cell, 112px) * 0.66); line-height: 1; color: var(--ink);
}
.cell::before, .cell::after { content: ""; position: absolute; pointer-events: none; }
.cell::before { left: 0; right: 0; top: 50%; border-top: 1.5px dashed var(--grid-soft); }
.cell::after { top: 0; bottom: 0; left: 50%; border-left: 1.5px dashed var(--grid-soft); }
.cell .g { position: relative; z-index: 1; }
.sep { font-family: var(--font-zh); font-size: 20px; color: var(--ink-2); }

.zh-sm { font-family: var(--font-zh); font-size: 30px; font-weight: 500; line-height: 1.2; }
.py { font-family: var(--font-py); font-weight: 600; font-size: 30px; line-height: 1.2; overflow-wrap: anywhere; }
.mean { font-size: 22px; font-weight: 600; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.mean.big { font-size: 30px; line-height: 1.2; }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }

/* answer buttons */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  min-height: 54px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent;
  font-weight: 700; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn kbd { font: 600 11px var(--font-ui); opacity: .7; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; }
.btn.again { border-color: var(--bad); color: var(--bad); }
.btn.got { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.solid { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); padding: 0 18px; }

/* finished panel */
.done {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; min-height: 350px;
  padding: 28px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
}
.done h2 { margin: 0; font-size: 24px; line-height: 1.2; text-wrap: balance; }
.done p { margin: 0; color: var(--ink-2); max-width: 36ch; text-wrap: pretty; }
.done .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }

/* footer */
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; color: var(--ink-2); font-size: 13px; }
.tones { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tones span.k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.tones .s { font-family: var(--font-py); font-weight: 600; font-size: 18px; }
.link { background: none; border: 0; padding: 8px 0; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.keys { font-size: 12px; color: var(--ink-2); }
/* Study / Review tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tabs button {
  min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--ink-2);
  font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.tabs button[aria-selected="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.tabs .badge {
  min-width: 22px; padding: 1px 7px; border-radius: 11px; font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--bad); color: #fff;
}
.tabs .badge[hidden] { display: none; }
.support { margin: 0; text-align: center; font-size: 13px; color: var(--ink-2); }
.support a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
@media (pointer: coarse) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .card-inner, .bar > i { transition: none; } }
@media (max-width: 380px) { .py { font-size: 26px; } .mean.big { font-size: 26px; } }
</style>
</head>

<div class="app">
  <header>
    <h1>HSK 1–5 Flashcards</h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Mode">
    <button type="button" role="tab" id="tabStudy" aria-selected="true">Study</button>
    <button type="button" role="tab" id="tabReview" aria-selected="false">Review <span class="badge" id="revCount" hidden>0</span></button>
  </nav>

  <section class="levels" id="levels" aria-label="Levels to practice"></section>

  <section class="opts">
    <div class="seg" role="group" aria-label="Card direction">
      <button type="button" id="dirZh" aria-pressed="true">汉字 → English</button>
      <button type="button" id="dirEn" aria-pressed="false">English → 汉字</button>
    </div>
    <label class="sw" for="skip" id="skipWrap"><input type="checkbox" id="skip"> Skip known</label>
    <label class="sw" for="shuf"><input type="checkbox" id="shuf"> Shuffle</label>
  </section>

  <section class="stats" aria-live="polite">
    <div class="nums">
      <span>Left <b id="nLeft">0</b></span>
      <span>Got it <b id="nGot">0</b></span>
      <span>Again <b id="nAgain">0</b></span>
    </div>
    <div class="bar"><i id="prog"></i></div>
  </section>

  <section id="practice">
    <div class="stage" id="stage">
      <button type="button" class="speak" id="speak" aria-label="Play pronunciation" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
      </button>
      <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">
        <div class="card-inner">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
    </div>
    <div class="done" id="done" hidden></div>
    <div class="actions" id="actions" style="margin-top:12px">
      <button type="button" class="btn again" id="again">Again <kbd>1</kbd></button>
      <button type="button" class="btn got" id="got">Got it <kbd>2</kbd></button>
    </div>
  </section>

  <footer class="foot">
    <div class="tones" aria-label="Tone colour key">
      <span class="k">Tones</span>
      <span class="s t1">mā</span><span class="s t2">má</span><span class="s t3">mǎ</span><span class="s t4">mà</span><span class="s t5">ma</span>
    </div>
    <span class="keys">Space flips · 1 again · 2 got it</span>
    <button type="button" class="link" id="reset">Reset progress</button>
  </footer>

  <p class="support">
    Free to use. If it helps your studying,
    <a href="https://ko-fi.com/YOUR_KOFI_USERNAME" target="_blank" rel="noopener">buy me a coffee on Ko-fi ☕</a>
  </p>
</div>

        p.textContent = 'All ' + sess.total + (sess.total === 1 ? ' word' : ' words') + ' from your Review list are cleared.';
      }
      row.appendChild(doneButton('Back to Study', 'solid', function () { setMode('study'); }));
    } else if (sess.total === 0) {
      h.textContent = 'Nothing left to practice here';
      p.textContent = 'Every word in the selected levels is marked as known' + (review.size ? ' or waiting in your Review tab.' : '.');
      if (review.size) row.appendChild(doneButton('Go to Review (' + review.size + ')', 'solid', function () { setMode('review'); }));
      row.appendChild(doneButton('Include known words', review.size ? '' : 'solid', function () { prefs.skip = false; save(); start(); }));
    } else {
      var missed = Object.keys(sess.missed).length;
      h.textContent = 'Session complete';
      p.textContent = sess.total + (sess.total === 1 ? ' word' : ' words') + ' studied, ' + (missed ? missed + ' moved to your Review tab.' : 'none needed another look.');
      if (missed) row.appendChild(doneButton('Go to Review (' + review.size + ')', 'solid', function () { setMode('review'); }));
      row.appendChild(doneButton('Study again', missed ? '' : 'solid', function () { start(); }));
    }
    d.appendChild(h); d.appendChild(p); d.appendChild(row);
  }

  function renderAll() {
    renderChips();
    var inReview = prefs.mode === 'review';
    $('tabStudy').setAttribute('aria-selected', inReview ? 'false' : 'true');
    $('tabReview').setAttribute('aria-selected', inReview ? 'true' : 'false');
    $('revCount').textContent = review.size;
    $('revCount').hidden = review.size === 0;
    $('levels').hidden = inReview;
    $('skipWrap').hidden = inReview;
    $('sub').textContent = inReview
      ? 'Review: only the words you marked "Again". Get one right to clear it from this list.'
      : CARDS.length + ' words from the HSK 2.0 lists. Progress is saved in this browser.';
    $('dirZh').setAttribute('aria-pressed', prefs.dir === 'zh' ? 'true' : 'false');
    $('dirEn').setAttribute('aria-pressed', prefs.dir === 'en' ? 'true' : 'false');
    $('skip').checked = prefs.skip;
    $('shuf').checked = prefs.shuffle;
    $('nLeft').textContent = sess.queue.length;
    $('nGot').textContent = sess.got;
    $('nAgain').textContent = sess.again;
    $('prog').style.width = (sess.total ? sess.got / sess.total * 100 : 0) + '%';
    var live = sess.queue.length > 0;
    $('stage').hidden = !live;
    $('actions').hidden = !live;
    $('done').hidden = live;
    if (live) renderCard(); else renderDone();
  }

  // ---------- speech ----------
  var canSpeak = false;
  try { canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'; } catch (e) { canSpeak = false; }
  if (canSpeak) $('speak').hidden = false;
  $('speak').addEventListener('click', function () {
    if (!sess || !sess.queue.length) return;
    try {
      var text = sess.queue[0].hz.replace(/[^一-鿿]+/g, ' ').trim();
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 0.85;
      speechSynthesis.speak(u);
    } catch (e) { /* speech not available */ }
  });

  // ---------- events ----------
  $('card').addEventListener('click', flip);
  $('again').addEventListener('click', function () { grade(false); });
  $('got').addEventListener('click', function () { grade(true); });
  $('dirZh').addEventListener('click', function () { prefs.dir = 'zh'; save(); start(); });
  $('dirEn').addEventListener('click', function () { prefs.dir = 'en'; save(); start(); });
  $('skip').addEventListener('change', function (e) { prefs.skip = e.target.checked; save(); start(); });
  $('shuf').addEventListener('change', function (e) { prefs.shuffle = e.target.checked; save(); start(); });

  var resetTimer = null;
  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!resetTimer) {
      b.textContent = 'Tap again to clear all progress';
      resetTimer = setTimeout(function () { resetTimer = null; b.textContent = 'Reset progress'; }, 4000);
      return;
    }
    clearTimeout(resetTimer);
    resetTimer = null;
    b.textContent = 'Reset progress';
    known.clear();
    review.clear();
    save();
    start();
  });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    var onCard = t && t.id === 'card';
    if (t && t !== document.body && !onCard && t.closest && t.closest('button, input, select, textarea')) return;
    if (e.key === ' ' || (e.key === 'Enter' && onCard)) { e.preventDefault(); flip(); }
    else if (e.key === '1') grade(false);
    else if (e.key === '2') grade(true);
  });

  $('tabStudy').addEventListener('click', function () { setMode('study'); });
  $('tabReview').addEventListener('click', function () { setMode('review'); });

  start();
})();
</script>
<script data-goatcounter="https://mxnmxn.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
